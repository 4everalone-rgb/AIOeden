<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BAYBOUND // SCANNER & VAULT v3.0</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-black: #050505;
            --neon-purple: #BF00FF;
            --neon-cyan: #00F0FF;
            --neon-green: #00ff88;
            --neon-yellow: #f0e100;
            --neon-red: #ff3366;
            --glass-bg: rgba(10, 10, 15, 0.65);
            --glass-border: rgba(191, 0, 255, 0.25);
        }

        body {
            background-color: var(--bg-black);
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Grid Overlay */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image:
                linear-gradient(rgba(191, 0, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(191, 0, 255, 0.03) 1px, transparent 1px);
            background-size: 50px 50px;
            pointer-events: none;
            z-index: 0;
        }

        /* Scanning Line Animation */
        .scan-line {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 3px;
            background: linear-gradient(90deg, transparent, var(--neon-cyan), var(--neon-purple), transparent);
            box-shadow: 0 0 20px var(--neon-cyan), 0 0 40px var(--neon-purple);
            animation: scanMove 4s linear infinite;
            z-index: 9999;
            pointer-events: none;
        }

        @keyframes scanMove {
            0% {
                transform: translateX(-100%);
            }

            100% {
                transform: translateX(100%);
            }
        }

        /* Header */
        .header {
            position: sticky;
            top: 0;
            z-index: 100;
            background: rgba(5, 5, 5, 0.85);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-bottom: 1px solid var(--glass-border);
            padding: 16px 32px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            font-family: 'JetBrains Mono', monospace;
            font-size: 1.1rem;
            font-weight: 700;
            color: var(--neon-cyan);
            text-shadow: 0 0 10px rgba(0, 240, 255, 0.4);
            letter-spacing: 1px;
        }

        .logo span {
            color: var(--neon-purple);
            text-shadow: 0 0 10px rgba(191, 0, 255, 0.4);
        }

        .version-badge {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--neon-purple);
            border: 1px solid var(--neon-purple);
            padding: 2px 8px;
            border-radius: 4px;
            background: rgba(191, 0, 255, 0.1);
        }

        /* Layout */
        .app-container {
            display: flex;
            min-height: calc(100vh - 60px);
            position: relative;
            z-index: 1;
        }

        /* Sidebar */
        .sidebar {
            width: 300px;
            min-width: 300px;
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-right: 1px solid var(--glass-border);
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 20px;
            overflow-y: auto;
            max-height: calc(100vh - 60px);
        }

        .sidebar-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--neon-purple);
            text-transform: uppercase;
            letter-spacing: 2px;
            border-bottom: 1px solid var(--glass-border);
            padding-bottom: 10px;
            margin-bottom: 4px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-group label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .form-group input {
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(191, 0, 255, 0.3);
            border-radius: 6px;
            padding: 10px 12px;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 0.85rem;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-group input:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 12px rgba(191, 0, 255, 0.2);
        }

        .form-group input::placeholder {
            color: rgba(224, 224, 224, 0.3);
        }

        .btn {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            font-weight: 600;
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            outline: none;
        }

        .btn-primary {
            background: linear-gradient(135deg, rgba(191, 0, 255, 0.2), rgba(191, 0, 255, 0.1));
            color: var(--neon-purple);
            border: 1px solid var(--neon-purple);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.15);
        }

        .btn-primary:hover {
            background: rgba(191, 0, 255, 0.3);
            box-shadow: 0 0 25px rgba(191, 0, 255, 0.3);
            transform: translateY(-1px);
        }

        .btn-cyan {
            background: linear-gradient(135deg, rgba(0, 240, 255, 0.15), rgba(0, 240, 255, 0.05));
            color: var(--neon-cyan);
            border: 1px solid var(--neon-cyan);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .btn-cyan:hover {
            background: rgba(0, 240, 255, 0.25);
            box-shadow: 0 0 25px rgba(0, 240, 255, 0.25);
            transform: translateY(-1px);
        }

        .client-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-top: 8px;
        }

        .client-item {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(191, 0, 255, 0.2);
            border-radius: 6px;
            padding: 10px 14px;
            cursor: pointer;
            transition: all 0.2s ease;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            color: #c0c0c0;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .client-item:hover {
            border-color: var(--neon-purple);
            background: rgba(191, 0, 255, 0.1);
            color: var(--neon-cyan);
            box-shadow: 0 0 15px rgba(191, 0, 255, 0.1);
        }

        .client-item .client-name {
            font-weight: 600;
        }

        .client-item .client-service {
            font-size: 0.7rem;
            color: var(--neon-purple);
            opacity: 0.8;
        }

        .empty-state {
            text-align: center;
            padding: 20px;
            color: rgba(224, 224, 224, 0.3);
            font-size: 0.8rem;
            font-family: 'JetBrains Mono', monospace;
        }

        /* Main Workspace */
        .main-workspace {
            flex: 1;
            padding: 32px;
            overflow-y: auto;
            max-height: calc(100vh - 60px);
        }

        .workspace-section {
            background: var(--glass-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 28px;
            margin-bottom: 24px;
        }

        .section-title {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.9rem;
            font-weight: 700;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .section-title::before {
            content: '▸';
            color: var(--neon-purple);
        }

        .client-info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 16px;
            margin-bottom: 24px;
        }

        .info-field {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 6px;
            padding: 10px 14px;
        }

        .info-field label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.65rem;
            color: var(--neon-cyan);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 4px;
        }

        .info-field input {
            background: transparent;
            border: none;
            color: #e0e0e0;
            font-family: 'Inter', sans-serif;
            font-size: 0.9rem;
            width: 100%;
            outline: none;
        }

        .textarea-wrapper {
            position: relative;
            margin-bottom: 20px;
        }

        .textarea-wrapper label {
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.75rem;
            color: var(--neon-purple);
            text-transform: uppercase;
            letter-spacing: 1px;
            display: block;
            margin-bottom: 8px;
        }

        textarea {
            width: 100%;
            min-height: 280px;
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(191, 0, 255, 0.3);
            border-radius: 8px;
            padding: 16px;
            color: #e0e0e0;
            font-family: 'JetBrains Mono', monospace;
            font-size: 0.8rem;
            line-height: 1.5;
            outline: none;
            resize: vertical;
            transition: all 0.2s ease;
        }

        textarea:focus {
            border-color: var(--neon-purple);
            box-shadow: 0 0 20px rgba(191, 0, 255, 0.15);
        }

        textarea::placeholder {
            color: rgba(224, 224, 224, 0.2);
        }

        .scan-btn {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
            letter-spacing: 2px;
            margin-bottom: 24px;
        }

        /* Triage Results */
        .triage-results {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Export Section */
        .export-section {
            margin-top: 8px;
        }

        .export-btn {
            width: 100%;
            padding: 16px;
            font-size: 1rem;
        }

        /* Scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
        }

        ::-webkit-scrollbar-track {
            background: transparent;
        }

        ::-webkit-scrollbar-thumb {
            background: rgba(191, 0, 255, 0.3);
            border-radius: 3px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: rgba(191, 0, 255, 0.5);
        }

        /* Responsive */
        @media (max-width: 900px) {
            .app-container {
                flex-direction: column;
            }

            .sidebar {
                width: 100%;
                max-height: none;
                border-right: none;
                border-bottom: 1px solid var(--glass-border);
            }

            .main-workspace {
                max-height: none;
            }
        }
    </style>
</head>

<body>
    <div class="scan-line"></div>

    <header class="header">
        <div class="logo">BAYBOUND <span>// SCANNER & VAULT</span></div>
        <div class="version-badge">v3.0</div>
    </header>

    <div class="app-container">
        <!-- Left Sidebar: Client Vault -->
        <aside class="sidebar">
            <div class="sidebar-title">Client Vault</div>

            <div class="form-group">
                <label for="vault-name">Name</label>
                <input type="text" id="vault-name" placeholder="Client full name">
            </div>

            <div class="form-group">
                <label for="vault-phone">Phone</label>
                <input type="text" id="vault-phone" placeholder="+1 234 567 8900">
            </div>

            <div class="form-group">
                <label for="vault-address">Address</label>
                <input type="text" id="vault-address" placeholder="Street address">
            </div>

            <div class="form-group">
                <label for="vault-city">City</label>
                <input type="text" id="vault-city" placeholder="City name">
            </div>

            <div class="form-group">
                <label for="vault-service">Service</label>
                <input type="text" id="vault-service" placeholder="Service type">
            </div>

            <button class="btn btn-primary" onclick="saveClient()">Save Client</button>

            <div class="sidebar-title" style="margin-top: 10px;">Saved Clients</div>
            <div id="client-list" class="client-list">
                <div class="empty-state">No clients saved yet</div>
            </div>
        </aside>

        <!-- Main Workspace -->
        <main class="main-workspace">
            <!-- Client Info Section -->
            <div class="workspace-section">
                <div class="section-title">Client Profile</div>
                <div class="client-info-grid">
                    <div class="info-field">
                        <label>Name</label>
                        <input type="text" id="scan-name" placeholder="Select a client...">
                    </div>
                    <div class="info-field">
                        <label>Phone</label>
                        <input type="text" id="scan-phone" placeholder="Select a client...">
                    </div>
                    <div class="info-field">
                        <label>City</label>
                        <input type="text" id="scan-city" placeholder="Select a client...">
                    </div>
                    <div class="info-field">
                        <label>Service</label>
                        <input type="text" id="scan-service" placeholder="Select a client...">
                    </div>
                </div>
            </div>

            <!-- Scanner Section -->
            <div class="workspace-section">
                <div class="section-title">Auto-Triage Scanner</div>

                <div class="textarea-wrapper">
                    <label for="source-input">Paste Client Source Code</label>
                    <textarea id="source-input" placeholder="Paste raw HTML source code here..."></textarea>
                </div>

                <button class="btn btn-primary scan-btn" onclick="runTriageScan()">Run Triage Scan</button>

                <div id="triage-results" class="triage-results"></div>
            </div>

            <!-- Export Section -->
            <div class="workspace-section export-section">
                <div class="section-title">Export Protocol</div>
                <button class="btn btn-cyan export-btn" id="export-btn" onclick="exportToSurgeon()">📤 Export to
                    Surgeon</button>
            </div>
        </main>
    </div>

    <script>
        // Initialize on load
        document.addEventListener('DOMContentLoaded', function () {
            renderClientList();
        });

        // Save Client to Vault
        function saveClient() {
            const name = document.getElementById('vault-name').value.trim();
            const phone = document.getElementById('vault-phone').value.trim();
            const address = document.getElementById('vault-address').value.trim();
            const city = document.getElementById('vault-city').value.trim();
            const service = document.getElementById('vault-service').value.trim();

            if (!name) {
                alert('Name is required to save a client.');
                return;
            }

            const client = { id: Date.now(), name, phone, address, city, service };

            let vault = JSON.parse(localStorage.getItem('baybound_vault')) || [];
            vault.push(client);
            localStorage.setItem('baybound_vault', JSON.stringify(vault));

            // Clear form
            document.getElementById('vault-name').value = '';
            document.getElementById('vault-phone').value = '';
            document.getElementById('vault-address').value = '';
            document.getElementById('vault-city').value = '';
            document.getElementById('vault-service').value = '';

            renderClientList();
        }

        // Render Client List
        function renderClientList() {
            const vault = JSON.parse(localStorage.getItem('baybound_vault')) || [];
            const listContainer = document.getElementById('client-list');

            if (vault.length === 0) {
                listContainer.innerHTML = '<div class="empty-state">No clients saved yet</div>';
                return;
            }

            listContainer.innerHTML = vault.map(client => `
                <div class="client-item" onclick="loadClient(${client.id})">
                    <div>
                        <div class="client-name">${escapeHtml(client.name)}</div>
                        <div class="client-service">${escapeHtml(client.service || 'No service')}</div>
                    </div>
                    <span style="color: var(--neon-purple); font-size: 0.9rem;">→</span>
                </div>
            `).join('');
        }

        // Load Client into Main Workspace
        function loadClient(id) {
            const vault = JSON.parse(localStorage.getItem('baybound_vault')) || [];
            const client = vault.find(c => c.id === id);

            if (!client) return;

            document.getElementById('scan-name').value = client.name || '';
            document.getElementById('scan-phone').value = client.phone || '';
            document.getElementById('scan-city').value = client.city || '';
            document.getElementById('scan-service').value = client.service || '';
        }

        // Run Triage Scan (Using DOMParser - Bulletproof)
        function runTriageScan() {
            const rawHtml = document.getElementById('source-input').value;
            const resultsDiv = document.getElementById('triage-results');
            resultsDiv.innerHTML = '';

            // Parse the pasted string into a real DOM
            const parser = new DOMParser();
            const doc = parser.parseFromString(rawHtml, 'text/html');
            let output = '';

            // 1. H1 CHECK
            const h1 = doc.querySelector('h1');
            if (!h1) {
                output += '<div style="color:#ff3366; border:1px solid #ff3366; padding:10px; margin-bottom:10px; border-radius:8px;">🔴 CRITICAL: H1 tag is missing.</div>';
            } else {
                const h1Text = h1.textContent.trim(); // Strips inner HTML tags automatically
                if (h1Text.length < 10) {
                    output += '<div style="color:#ff3366; border:1px solid #ff3366; padding:10px; margin-bottom:10px; border-radius:8px;">🔴 CRITICAL: H1 tag is too weak ("' + h1Text + '").</div>';
                } else {
                    output += '<div style="color:#00ff88; border:1px solid #00ff88; padding:10px; margin-bottom:10px; border-radius:8px;">🟢 PASS: Strong H1 tag found ("' + h1Text + '").</div>';
                }
            }

            // 2. META DESCRIPTION CHECK
            const metaDesc = doc.querySelector('meta[name="description"]');
            if (!metaDesc || !metaDesc.getAttribute('content')) {
                output += '<div style="color:#ff3366; border:1px solid #ff3366; padding:10px; margin-bottom:10px; border-radius:8px;">🔴 CRITICAL: Meta description is missing.</div>';
            } else {
                const descLength = metaDesc.getAttribute('content').length;
                if (descLength > 160) {
                    output += '<div style="color:#ff3366; border:1px solid #ff3366; padding:10px; margin-bottom:10px; border-radius:8px;">🔴 CRITICAL: Meta description is too long (' + descLength + ' chars).</div>';
                } else if (descLength > 140) {
                    output += '<div style="color:#f0e100; border:1px solid #f0e100; padding:10px; margin-bottom:10px; border-radius:8px;">🟡 WARNING: Meta description is slightly long (' + descLength + ' chars).</div>';
                } else {
                    output += '<div style="color:#00ff88; border:1px solid #00ff88; padding:10px; margin-bottom:10px; border-radius:8px;">🟢 PASS: Meta description is optimal (' + descLength + ' chars).</div>';
                }
            }

            // 3. SCHEMA CHECK
            const schemaScript = doc.querySelector('script[type="application/ld+json"]');
            if (!schemaScript) {
                output += '<div style="color:#ff3366; border:1px solid #ff3366; padding:10px; margin-bottom:10px; border-radius:8px;">🔴 CRITICAL: JSON-LD Schema markup is missing.</div>';
            } else {
                output += '<div style="color:#00ff88; border:1px solid #00ff88; padding:10px; margin-bottom:10px; border-radius:8px;">🟢 PASS: JSON-LD Schema markup found.</div>';
            }

            resultsDiv.innerHTML = output;
        }

        // Export to Surgeon (FIXED LOGIC)
        function exportToSurgeon() {
            const name = document.getElementById('scan-name').value.trim();
            const phone = document.getElementById('scan-phone').value.trim();
            const city = document.getElementById('scan-city').value.trim();
            const service = document.getElementById('scan-service').value.trim();
            const rawHtml = document.getElementById('source-input').value.trim();
            const resultsDiv = document.getElementById('triage-results');

            // BYPASS THE FLAG: Just check if there is literally any text inside the results box
            const triageText = resultsDiv.innerText.trim();

            if (!triageText) {
                alert('You must complete a triage before exporting.');
                return;
            }

            const exportBlock = `SYSTEM OVERRIDE: BAYBOUND AIO SURGEON MODE ACTIVATED
═══════════════════════════════════════════════════════════════

CLIENT DATA:
Name: ${name || 'N/A'}
Phone: ${phone || 'N/A'}
City: ${city || 'N/A'}
Service: ${service || 'N/A'}

───────────────────────────────────────────────────────────────

RAW HTML SOURCE:
[${rawHtml.length} characters captured]

 ${rawHtml}

───────────────────────────────────────────────────────────────

TRIAGE SCAN RESULTS:
 ${triageText}

═══════════════════════════════════════════════════════════════
END TRANSMISSION // BAYBOUND SCANNER & VAULT v3.0`;

            navigator.clipboard.writeText(exportBlock).then(() => {
                const btn = document.getElementById('export-btn');
                const originalText = btn.textContent;
                btn.textContent = 'COPIED ✓';
                btn.style.background = 'rgba(0, 255, 136, 0.2)';
                btn.style.borderColor = 'var(--neon-green)';
                btn.style.color = 'var(--neon-green)';

                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.style.borderColor = '';
                    btn.style.color = '';
                }, 2000);
            }).catch(err => {
                console.error('Clipboard copy failed:', err);
                alert('Copy failed. Please check browser clipboard permissions.');
            });
        }

        // Utility: Escape HTML
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>

</html>
